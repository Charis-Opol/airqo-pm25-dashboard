services:
  - type: web
    name: airqo-pm25-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      # Optional settings, see .env.example. Set the values in the Render dashboard.
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MODEL_API_URL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: UI_API_BASE_URL
        sync: false
      - key: UI_API_KEY
        sync: false
